<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كاشف منتجات خيام</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>كاشف منتجات خيام</h1>
  <p>الصق صورة (Ctrl+V) أو اسحبها هنا أو ارفعها، وسأخبرك باسم المنتج ونسبة التطابق.</p>
</header>
<main>
  <section id="drop" tabindex="0">
    <div id="dropText">
      <strong>الصق الصورة هنا</strong>
      <span>أو اسحبها وأفلتها • أو</span>
      <button class="btn" id="pasteBtn" type="button">📋 لصق من الحافظة</button>
      <label class="btn">اختر صورة<input type="file" id="file" accept="image/*" multiple hidden></label>
      <label class="btn alt">الكاميرا<input type="file" id="cam" accept="image/*" capture="environment" hidden></label>
    </div>
    <img id="preview" alt="" hidden>
  </section>
  <div id="status">جاري تحميل النموذج وقاعدة الصور…</div>
  <section id="results"></section>
</main>
<footer>تعمل المطابقة بالكامل داخل متصفحك — لا يتم رفع صورك لأي خادم.</footer>
<script type="module" src="app.js"></script>
</body>
</html>
